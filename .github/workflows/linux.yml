name: Linux

# Compila los paquetes de Linux en una maquina Linux. No se pueden generar
# desde Windows: npm solo instala el binario de terminal (node-pty) de la
# plataforma en la que corre, y el paquete acabaria llevando el de Windows.
#
# - Al subir una etiqueta vX.Y.Z, adjunta el AppImage y el .deb a la Release.
# - Desde la pestana Actions se puede lanzar a mano para descargar los
#   paquetes como artefactos, sin publicar nada.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Empaquetar AppImage y .deb
        run: npm run dist:linux

      # Las dos piezas que dependen de la plataforma, probadas DENTRO del
      # paquete, usando el binario de la propia app como runtime de Node

      - name: Prueba del servidor MCP empaquetado
        run: >
          node test/mcp.test.js
          dist/linux-unpacked/gcenter
          dist/linux-unpacked/resources/app.asar/src/mcp/server.js

      - name: Prueba del terminal empaquetado
        run: >
          ELECTRON_RUN_AS_NODE=1 dist/linux-unpacked/gcenter test/pty.test.js
          "$PWD/dist/linux-unpacked/resources/app.asar/node_modules/@lydell/node-pty"

      - name: Guardar los paquetes
        uses: actions/upload-artifact@v4
        with:
          name: gcenter-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb \
              --title "GCenter $GITHUB_REF_NAME" --generate-notes
          fi
